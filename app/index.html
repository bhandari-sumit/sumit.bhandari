
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening eSewa</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const androidStore =
        "https://play.google.com/store/apps/details?id=com.f1soft.esewa&hl=en";
      const iosStore =
        "https://apps.apple.com/np/app/esewa/id614370939";

      if (isAndroid) {
        window.location.replace(androidStore);
      } else if (isIOS) {
        window.location.replace(iosStore);
      } else {
        document.addEventListener("DOMContentLoaded", function () {
          document.getElementById("fallback").hidden = false;
        });
      }
    })();
  </script>
</head>
<body>
  <div id="fallback" hidden>
    <h2>Download eSewa</h2>
    <p>Open this link on your phone to get the correct app store.</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.f1soft.esewa&hl=en">Google Play Store</a></p>
    <p><a href="https://apps.apple.com/np/app/esewa/id614370939">Apple App Store</a></p>
  </div>
</body>
</html>
