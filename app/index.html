
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Opening eSewa...</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      color: #333;
    }

    a {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      background: #087e3f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS =
        /iPhone|iPod|iPad/i.test(ua) ||
        (navigator.platform === "MacIntel" &&
         navigator.maxTouchPoints > 1);

      var playStoreWeb =
        "https://play.google.com/store/apps/details?id=com.f1soft.esewa&hl=en";

      var playStoreIntent =
        "intent://details?id=com.f1soft.esewa#Intent;" +
        "scheme=market;" +
        "package=com.android.vending;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(playStoreWeb) +
        ";end";

      var appleStore =
        "https://apps.apple.com/np/app/esewa/id614370939";

      if (isAndroid) {
        window.location.replace(playStoreIntent);
      } else if (isIOS) {
        window.location.replace(appleStore);
      } else {
        document.addEventListener("DOMContentLoaded", function () {
          document.getElementById("fallback").hidden = false;
        });
      }
    })();
  </script>
</head>

<body>
  <div id="fallback" hidden>
    <h2>Download eSewa</h2>
    <p>Open this link on your phone to download eSewa.</p>

    <a href="https://play.google.com/store/apps/details?id=com.f1soft.esewa&hl=en">
      Google Play Store
    </a>

    <a href="https://apps.apple.com/np/app/esewa/id614370939">
      Apple App Store
    </a>
  </div>
</body>
</html>
