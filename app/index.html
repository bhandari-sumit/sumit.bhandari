
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening eSewa...</title>
<script>
(function () {
  var ua = navigator.userAgent || "";

  if (/Android/i.test(ua)) {
    window.location.replace(
      "https://play.google.com/store/apps/details?id=com.f1soft.esewa&hl=en"
    );
  } else if (/iPhone|iPod|iPad/i.test(ua) ||
      (navigator.platform === "MacIntel" &&
       navigator.maxTouchPoints > 1)) {
    window.location.replace(
      "https://apps.apple.com/np/app/esewa/id614370939"
    );
  } else {
    document.addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML =
        "<p>Scan or open this link on your phone to download eSewa.</p>";
    });
  }
})();
</script>
</head>
<body>
  <p>If you are not redirected automatically, choose your app store:</p>
  <p>
    <a href="https://play.google.com/store/apps/details?id=com.f1soft.esewa&hl=en">
      Google Play Store
    </a>
  </p>
  <p>
    <a href="https://apps.apple.com/np/app/esewa/id614370939">
      Apple App Store
    </a>
  </p>
</body>
</html>
